      <div id="p03-s1" class="k-sub"><span class="k-w p03-w1">Je</span> <span class="k-w p03-w1">dessine</span> <span class="k-w p03-w1">l’<span class="k-box p03-boxw"><i id="p03-box1" class="k-box-bg"></i><span class="k-box-tx"><span>interface</span><span id="p03-pap1" class="p03-pap">interface</span></span></span>.</span></div>
      <div id="p03-s2" class="k-sub"><span class="k-w p03-w2">Au</span> <span class="k-trait"><span class="k-w p03-w2">pixel</span><svg id="p03-trait" class="k-trait-svg" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 6 C 20 3.6, 60 3.2, 100 4.6 L 100 5.4 C 60 6.4, 20 8.6, 0 7.4 Z" fill="#d97757"/></svg></span> <span class="k-w p03-w2">près.</span></div>

    <div id="p03-grainclip" class="clip" data-start="0" data-duration="5.5" data-track-index="3" data-layout-ignore>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "03-interface";
      var T = 5.5;

      /* ===== kit claude-intro (JS) ===== */
/* flou en px écran sur un élément (0 = "none") */
function kBlur(el, px) { el.style.filter = px > 0.25 ? "blur(" + px.toFixed(1) + "px)" : "none"; }
/* caméra 2D : le point monde (c.x, c.y) au centre de l'écran, échelle c.s ; le monde est un plan 1920x1080 */
function kCam(worldEl, c) {
  worldEl.style.transformOrigin = "0 0";
  worldEl.style.transform = "translate(" + (960 - c.x * c.s).toFixed(2) + "px," + (540 - c.y * c.s).toFixed(2) + "px) scale(" + c.s.toFixed(4) + ")";
}
/* un mot du sous-titre arrive : y +10, flou 6 -> 0, opacité 0 -> 1 en 0,16 s */
function kWord(tl, el, t) {
  tl.fromTo(el, { opacity: 0, y: 10, filter: "blur(6px)" },
    { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.16, ease: "power2.out", immediateRender: t <= 0 }, t);
}
/* une ligne de sous-titre : mots sur leurs cues, sortie vers le haut à tOut (0,14 s) ; tOut null = reste */
function kLine(tl, lineEl, wordEls, cues, tOut) {
  for (var i = 0; i < wordEls.length; i++) kWord(tl, wordEls[i], cues[i]);
  if (tOut != null) tl.fromTo(lineEl, { y: 0, opacity: 1, filter: "blur(0px)" },
    { y: -14, opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in", immediateRender: false }, tOut);
}
/* boîte du mot clé : le fond corail se trace (0,16 s power3.out) */
function kBox(tl, bgEl, t) {
  tl.fromTo(bgEl, { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, t);
}
/* trait du pic : se dessine de gauche à droite (0,4 s power2.out) */
function kTrait(tl, svgEl, t) {
  tl.fromTo(svgEl, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, t);
}
/* arrivée « trop grand et flou, puis se pose » : ×1,15 flou 10 -> ×1 net en 0,22 s expo.out */
function kArrive(tl, el, t, from) {
  from = from || 1.15;
  tl.fromTo(el, { opacity: 0, scale: from, filter: "blur(10px)" },
    { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "expo.out", immediateRender: t <= 0 }, t);
}
/* curseur : un seul geste courbe de (x0,y0) à (x1,y1), de t à t+d (power3.inOut), puis clic direct à t+d+0.04 :
   pression 0,86 et anneau corail qui s'ouvre (ringEl optionnel, placé au point d'arrivée) */
function kCursor(tl, el, x0, y0, x1, y1, t, d, ringEl) {
  var p = { k: 0 };
  var cx = (x0 + x1) / 2 + (y1 - y0) * 0.22, cy = (y0 + y1) / 2 - (x1 - x0) * 0.22;
  function place() {
    var k = p.k, a = (1 - k) * (1 - k), b = 2 * (1 - k) * k, c = k * k;
    el.style.left = "0px"; el.style.top = "0px";
    gsap.set(el, { x: a * x0 + b * cx + c * x1, y: a * y0 + b * cy + c * y1 });
  }
  tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none", immediateRender: false }, t);
  tl.fromTo(p, { k: 0 }, { k: 1, duration: d, ease: "power3.inOut", immediateRender: false, onUpdate: place }, t);
  tl.fromTo(el, { scale: 1 }, { scale: 0.86, duration: 0.06, ease: "power2.in", immediateRender: false }, t + d + 0.04);
  tl.fromTo(el, { scale: 0.86 }, { scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, t + d + 0.10);
  if (ringEl) {
    gsap.set(ringEl, { left: x1 + "px", top: y1 + "px" });
    tl.fromTo(ringEl, { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.45, ease: "power2.out", immediateRender: false }, t + d + 0.06);
  }
  place();
}
/* découpe le texte d'un élément en <span class="k-ch"> (opacité 0), chacun avec son caret <i class="k-ch-caret"> (à l'init, une fois) */
function kSplit(el) {
  var s = el.textContent; el.textContent = "";
  var out = [];
  for (var i = 0; i < s.length; i++) {
    var c = document.createElement("span"); c.className = "k-ch"; c.style.opacity = "0"; c.textContent = s[i];
    var k = document.createElement("i"); k.className = "k-ch-caret"; c.appendChild(k);
    el.appendChild(c); out.push(c);
  }
  return out;
}
/* frappe : les caractères (de kSplit, un ou plusieurs tableaux concaténés) apparaissent un par un de t à t+d ; le caret
   corail suit le dernier caractère tapé ; keepCaret = le caret du dernier caractère reste allumé à la fin.
   Renvoie le caret final (pour le faire clignoter avec kBlink). */
function kType(tl, chEls, t, d, keepCaret) {
  var step = d / Math.max(1, chEls.length);
  for (var i = 0; i < chEls.length; i++) {
    var ti = t + i * step, car = chEls[i].lastChild;
    tl.fromTo(chEls[i], { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, ti);
    tl.fromTo(car, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, ti);
    if (i < chEls.length - 1 || !keepCaret)
      tl.fromTo(car, { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none", immediateRender: false }, ti + step);
  }
  return chEls.length ? chEls[chEls.length - 1].lastChild : null;
}
/* clignotement fini d'un caret : éteint à chaque temps de la liste pendant off s (0,2 par défaut) */
function kBlink(tl, caretEl, times, off) {
  off = off || 0.2;
  for (var i = 0; i < times.length; i++) {
    tl.fromTo(caretEl, { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none", immediateRender: false }, times[i]);
    tl.fromTo(caretEl, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, times[i] + off);
  }
}
/* ===== fin du kit (JS) ===== */

      var byId = function (id) { return document.getElementById(id); };
      var world = byId("p03-world");
      var cam = { x: 960, y: 480, s: 1.08, b: 12 };
      function render() { kCam(world, cam); kBlur(world, cam.b); }

      var tl = gsap.timeline({ paused: true, defaults: { lazy: false }, onUpdate: render });

      /* formatage français : espace fine insécable en séparateur de milliers */
      function fr(n, dec) {
        var s = n.toFixed(dec).split(".");
        var i = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        return dec ? i + "," + s[1] : i;
      }
      function out(el, t, d) {
        tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: d || 0.12, ease: "power2.in", immediateRender: false }, t);
      }
      function fadeIn(el, t, d) {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d || 0.2, ease: "power2.out", immediateRender: false }, t);
      }
      /* impression d'un texte : le squelette s'efface, le texte arrive (kArrive) */
      function print(el, sk, t) {
        if (sk) out(sk, t, 0.12);
        kArrive(tl, el, t, 1.08);
      }
      function roll(el, to, dec, suffix, t) {
        var p = { v: 0 };
        tl.fromTo(p, { v: 0 }, { v: to, duration: 0.5, ease: "power3.out", immediateRender: false,
          onUpdate: function () { el.textContent = fr(dec ? p.v : Math.round(p.v), dec) + suffix; } }, t);
      }

      /* ---- caméra ---- */
      tl.fromTo(cam, { x: 960, y: 480, s: 1.08, b: 12 }, { x: 960, y: 480, s: 1.0, b: 0, duration: 0.35, ease: "expo.out" }, 0);
      tl.fromTo(cam, { s: 1.0 }, { s: 1.02, duration: 1.45, ease: "none", immediateRender: false }, 0.35);
      tl.fromTo(cam, { x: 960, y: 480, s: 1.02 }, { x: 1500, y: 260, s: 1.40, duration: 0.4, ease: "power3.inOut", immediateRender: false }, 1.8);
      tl.fromTo(cam, { b: 0 }, { b: 2, duration: 0.2, ease: "power2.in", immediateRender: false }, 1.8);
      tl.fromTo(cam, { b: 2 }, { b: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 2.0);
      tl.fromTo(cam, { s: 1.40 }, { s: 1.44, duration: 1.2, ease: "none", immediateRender: false }, 2.2);
      tl.fromTo(cam, { x: 1500, y: 260, s: 1.44 }, { x: 1080, y: 335, s: 1.30, duration: 0.45, ease: "power3.inOut", immediateRender: false }, 3.4);
      tl.fromTo(cam, { b: 0 }, { b: 2, duration: 0.22, ease: "power2.in", immediateRender: false }, 3.4);
      tl.fromTo(cam, { b: 2 }, { b: 0, duration: 0.23, ease: "power2.out", immediateRender: false }, 3.62);
      tl.fromTo(cam, { x: 1080, s: 1.30 }, { x: 900, s: 1.32, duration: 0.95, ease: "none", immediateRender: false }, 3.85);
      tl.fromTo(cam, { x: 900, y: 335, s: 1.32 }, { x: 640, y: 335, s: 3.3, duration: 0.7, ease: "power2.in", immediateRender: false }, 4.8);
      tl.fromTo(cam, { b: 0 }, { b: 10, duration: 0.3, ease: "power2.in", immediateRender: false }, 5.2);

      /* grain qui glisse d'un motif */
      tl.fromTo(byId("p03-grain"), { x: 0 }, { x: -240, duration: T, ease: "none" }, 0);

      /* ===== Scene 1 : le tableau de bord se pose et s'imprime ===== */
      print(byId("p03-brand"), byId("p03-sk-brand"), 0.35);
      out(byId("p03-sk-n1"), 0.40, 0.12);
      kArrive(tl, byId("p03-pill"), 0.40, 1.08);
      kArrive(tl, byId("p03-n1"), 0.40, 1.08);
      print(byId("p03-n2"), byId("p03-sk-n2"), 0.45);
      print(byId("p03-n3"), byId("p03-sk-n3"), 0.50);
      print(byId("p03-n4"), byId("p03-sk-n4"), 0.55);
      print(byId("p03-title"), byId("p03-sk-title"), 0.60);
      print(byId("p03-date"), byId("p03-sk-date"), 0.68);
      print(byId("p03-bt1"), byId("p03-btsk"), 0.72);

      var vals = [["p03-v1", 48320, 0, " €"], ["p03-v2", 1284, 0, ""], ["p03-v3", 37.6, 2, " €"]];
      for (var i = 0; i < 3; i++) {
        var tc = 0.85 + i * 0.15, n = i + 1;
        print(byId("p03-l" + n), byId("p03-skl" + n), tc);
        out(byId("p03-skv" + n), tc, 0.12);
        fadeIn(byId("p03-v" + n), tc, 0.12);
        roll(byId("p03-v" + n), vals[i][1], vals[i][2], vals[i][3], tc);
      }
      kArrive(tl, byId("p03-up"), 1.30, 1.15);

      print(byId("p03-tt"), byId("p03-sk-tt"), 1.25);
      for (var r = 1; r <= 3; r++) {
        var tr = 1.35 + (r - 1) * 0.1;
        out(byId("p03-rs" + r), tr, 0.12);
        tl.fromTo(byId("p03-r" + r), { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, tr);
      }

      /* sous-titre « Je dessine l’[interface]. » */
      var w1 = Array.prototype.slice.call(document.getElementsByClassName("p03-w1"));
      kLine(tl, byId("p03-s1"), w1, [0.30, 0.48, 0.85], 2.90);
      kBox(tl, byId("p03-box1"), 0.84);
      tl.fromTo(byId("p03-pap1"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 0.84);

      /* ===== Scene 2 : le design au pixel près ===== */
      var cur = byId("p03-cursor"), curw = byId("p03-curw"), btn = byId("p03-btn");
      kCursor(tl, cur, 1200, 700, 1620, 166, 1.85, 0.4);
      tl.fromTo(btn, { scale: 1 }, { scale: 0.97, duration: 0.06, ease: "power2.in", immediateRender: false }, 2.29);
      tl.fromTo(btn, { scale: 0.97 }, { scale: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, 2.35);

      /* cadre de sélection qui se trace + poignées + étiquette */
      fadeIn(byId("p03-sel"), 2.25, 0.04);
      tl.fromTo(byId("p03-et"), { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, 2.25);
      tl.fromTo(byId("p03-er"), { scaleY: 0 }, { scaleY: 1, duration: 0.14, ease: "power3.out", immediateRender: false }, 2.29);
      tl.fromTo(byId("p03-eb"), { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, 2.31);
      tl.fromTo(byId("p03-el"), { scaleY: 0 }, { scaleY: 1, duration: 0.14, ease: "power3.out", immediateRender: false }, 2.35);
      ["p03-hTL", "p03-hTR", "p03-hBR", "p03-hBL"].forEach(function (id, k) {
        tl.fromTo(byId(id), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power3.out", immediateRender: false }, 2.33 + k * 0.03);
      });
      kArrive(tl, byId("p03-tag"), 2.33, 1.1);

      /* panneau de couleurs relié par un filet */
      fadeIn(byId("p03-link"), 2.45, 0.04);
      tl.fromTo(byId("p03-link"), { scaleY: 0 }, { scaleY: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 2.45);
      kArrive(tl, byId("p03-pal"), 2.47, 1.08);

      /* le curseur glisse sur la pastille corail et clique */
      tl.fromTo(curw, { x: 0 }, { x: 72, duration: 0.22, ease: "power2.inOut", immediateRender: false }, 2.50);
      tl.fromTo(curw, { y: 0 }, { y: 90, duration: 0.22, ease: "power3.inOut", immediateRender: false }, 2.50);
      tl.fromTo(cur, { scale: 1 }, { scale: 0.86, duration: 0.06, ease: "power2.in", immediateRender: false }, 2.72);
      tl.fromTo(cur, { scale: 0.86 }, { scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, 2.78);
      tl.fromTo(byId("p03-ring"), { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.45, ease: "power2.out", immediateRender: false }, 2.74);
      tl.fromTo(byId("p03-swr"), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power3.out", immediateRender: false }, 2.76);

      /* le bouton passe au corail (fondu d'un second fond), texte papier */
      fadeIn(byId("p03-bg2"), 2.80, 0.2);
      out(byId("p03-bg1"), 2.80, 0.2);
      fadeIn(byId("p03-bt2"), 2.80, 0.2);
      out(byId("p03-bt1"), 2.80, 0.2);

      /* le curseur attrape la poignée en haut à gauche et la tire : coins 8 -> 26 px */
      tl.fromTo(curw, { x: 72 }, { x: -82, duration: 0.24, ease: "power2.inOut", immediateRender: false }, 2.84);
      tl.fromTo(curw, { y: 90 }, { y: -28, duration: 0.24, ease: "power3.inOut", immediateRender: false }, 2.84);
      tl.fromTo(cur, { scale: 1 }, { scale: 0.86, duration: 0.06, ease: "power2.in", immediateRender: false }, 3.06);
      tl.fromTo(curw, { x: -82, y: -28 }, { x: -75, y: -21, duration: 0.2, ease: "power2.inOut", immediateRender: false }, 3.10);
      tl.fromTo(byId("p03-hTL"), { x: 0, y: 0 }, { x: 7, y: 7, duration: 0.2, ease: "power2.inOut", immediateRender: false }, 3.10);
      fadeIn(byId("p03-bg3"), 3.10, 0.22);
      out(byId("p03-bg2"), 3.10, 0.22);
      tl.fromTo(cur, { scale: 0.86 }, { scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, 3.32);

      /* la sélection et le panneau s'effacent, puis le curseur */
      ["p03-sel", "p03-link", "p03-pal"].forEach(function (id) { out(byId(id), 3.40, 0.12); });
      out(cur, 3.50, 0.1);

      /* repères de mesure « 40 » entre les cartes */
      [["p03-ru1", "p03-rl1"], ["p03-ru2", "p03-rl2"]].forEach(function (p, k) {
        var tt = 3.55 + k * 0.15;
        tl.fromTo(byId(p[0]), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, tt);
        tl.fromTo(byId(p[1]), { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, tt);
        out(byId(p[0]), 4.40, 0.12);
      });

      /* la carte 1 se soulève */
      tl.fromTo(byId("p03-cw1"), { scale: 1 }, { scale: 1.02, duration: 0.4, ease: "power3.out", immediateRender: false }, 4.50);
      fadeIn(byId("p03-lift"), 4.50, 0.4);

      /* sous-titre « Au [pixel] près. » */
      var w2 = Array.prototype.slice.call(document.getElementsByClassName("p03-w2"));
      kLine(tl, byId("p03-s2"), w2, [3.30, 3.45, 3.75], 5.10);
      kTrait(tl, byId("p03-trait"), 3.85);

      render();
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
