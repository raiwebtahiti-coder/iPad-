function kCam(world, c) {
  world.style.transformOrigin = "0 0";
  world.style.transform = "translate(" + (960 - c.x * c.s).toFixed(2) + "px," + (540 - c.y * c.s).toFixed(2) + "px) scale(" + c.s.toFixed(4) + ")";

}
/* arrivée : un peu trop grand et flou, puis se pose (0,4 s expo.out) */
function kArrive(tl, el, t, from, dy) {
  tl.fromTo(el, { opacity: 0, scale: from || 1.12, y: dy || 0, filter: "blur(10px)" },

}
/* sortie rapide */
function kLeave(tl, el, t, dy) {

}
/* surligneur jaune qui passe derrière un mot (.k-mk-bg) */
function kMark(tl, bg, t) { tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, t); }
/* cadre de mise en évidence (.k-spot) : se resserre sur la cible */
function kSpot(tl, el, t, tOut) {

}

function kPop(tl, el, t) { tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)", immediateRender: false }, t); }
