# Rai Web Design — configuration Netlify
# Site statique : rien à compiler, le script prépare seulement le dossier publié.
# Les en-têtes de cache et de sécurité sont dans dist/_headers, écrit par ce script,
# pour qu'ils s'appliquent aussi à un dossier déposé à la main dans Netlify.

[build]
  publish = "dist"
  command = "bash scripts/build.sh"
