      tl.fromTo(cam, { b: 0 }, { b: 8, duration: 0.3, ease: "power2.in", immediateRender: false }, 5.2);

      /* ---- grain qui glisse d'un motif ---- */
      tl.fromTo(byId("p04-grain"), { x: 0 }, { x: -240, duration: T, ease: "none" }, 0);

      /* ===== Scene 1 : le graphique pousse ===== */
      /* grille : y 600, 680, 520, de gauche à droite */
      ["p04-g0", "p04-g1", "p04-g2"].forEach(function (id, k) {
        var t = 0.4 + 0.05 * k;
        tl.fromTo(byId(id), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, t);
        tl.fromTo(byId(id), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, t);
      });
      /* mois */
      for (var m = 0; m < 6; m++) {
        tl.fromTo(byId("p04-m" + m), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 0.55 + 0.03 * m);
      }
      /* barres + valeurs qui roulent */
      for (var i = 0; i < 6; i++) {
        (function (i) {
          var t = 0.6 + 0.15 * i;
          var bar = byId("p04-bar" + i);
          tl.fromTo(bar, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, t);
          tl.fromTo(bar, { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "expo.out", immediateRender: false }, t);
          var vEl = byId("p04-v" + i), sp = vEl.firstChild;
          var p = { v: 0 };
          tl.fromTo(vEl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, t + 0.02);
          tl.fromTo(p, { v: 0 }, { v: V[i], duration: 0.5, ease: "power3.out", immediateRender: false,
            onUpdate: function () { sp.textContent = fmt(p.v); } }, t);
        })(i);
      }

      /* courbe de tendance sur les sommets (Catmull-Rom -> Bézier) */
      var P = [];
      for (var j = 0; j < 6; j++) P.push([barX(j) + 60, BASE - H[j]]);
      var d = "M" + P[0][0] + " " + P[0][1];
      for (var j2 = 0; j2 < 5; j2++) {
        var p0 = P[Math.max(0, j2 - 1)], p1 = P[j2], p2 = P[j2 + 1], p3 = P[Math.min(5, j2 + 2)];
        var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
        var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
        d += " C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + ", " + c2x.toFixed(1) + " " + c2y.toFixed(1) + ", " + p2[0] + " " + p2[1];
      }
      var trend = byId("p04-trend");
      trend.setAttribute("d", d);
      var LT = trend.getTotalLength() * 1.02;
      trend.style.strokeDasharray = LT;
      trend.style.strokeDashoffset = LT;
      tl.fromTo(trend, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, 1.5);
      tl.fromTo(trend, { strokeDashoffset: LT }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 1.5);

      /* juin s'éclaire */
      var halo = byId("p04-halo");
      tl.fromTo(halo, { opacity: 0 }, { opacity: 0.6, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.3);

      /* annotation + filet */
      var filet = byId("p04-filet");
      var LF = filet.getTotalLength() * 1.05;
      filet.style.strokeDasharray = LF;
      filet.style.strokeDashoffset = LF;
      tl.fromTo(filet, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, 2.4);
      tl.fromTo(filet, { strokeDashoffset: LF }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 2.4);
      kArrive(tl, byId("p04-annot"), 2.4, 1.15);

      /* sous-titre « J’analyse tes [données]. » */
      var w1 = Array.prototype.slice.call(document.getElementsByClassName("p04-w1"));
      kLine(tl, byId("p04-s1"), w1, [0.4, 0.8, 0.95, 0.95], 2.55);
      kBox(tl, byId("p04-box1"), 0.93);
      tl.fromTo(byId("p04-dink"), { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none", immediateRender: false }, 0.96);
      tl.fromTo(byId("p04-dpap"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none", immediateRender: false }, 0.96);

      /* ===== Scene 2 : l'essentiel, puis les barres se couchent ===== */
      /* tenue vivante sur juin */
      tl.fromTo(halo, { opacity: 0.6 }, { opacity: 1, duration: 0.9, ease: "sine.inOut", immediateRender: false }, 2.6);
      tl.fromTo(byId("p04-v5c"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, 2.8);
      tl.fromTo(byId("p04-v5").firstChild, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.out", immediateRender: false }, 2.8);

      /* sous-titre « Et j’en tire l’[essentiel]. » */
      var w2 = Array.prototype.slice.call(document.getElementsByClassName("p04-w2"));
      kLine(tl, byId("p04-s2"), w2, [2.75, 2.9, 3.1, 3.3], 4.6);
      kTrait(tl, byId("p04-trait"), 3.42);

      /* 4.00 : tout s'efface sauf les barres */
      ["p04-label", "p04-kpi", "p04-gridg", "p04-mos", "p04-vals", "p04-trend", "p04-annot", "p04-filet", "p04-halo"].forEach(function (id, k) {
        tl.fromTo(byId(id), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, 4.0 + 0.03 * k);
      });
      /* 4.10 : le fond du panneau s'efface */
      tl.fromTo(byId("p04-panel"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 4.1);

      /* 4.35 à 5.00 : chaque barre se couche et devient un clip (transformation pure vers l'identité) */
      for (var c = 0; c < 6; c++) {
        (function (i) {
          var t = 4.35 + 0.05 * i;
          var clip = byId("p04-clip" + i), bar = byId("p04-bar" + i);
          var cxClip = 360 + 204 * i + 90, cyClip = 760 + 28;
          var cxBar = barX(i) + 60, cyBar = BASE - H[i] / 2;
          tl.fromTo(bar, { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none", immediateRender: false }, t);
          tl.fromTo(clip, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, t);
          tl.fromTo(clip, { x: cxBar - cxClip, y: cyBar - cyClip, scaleX: 120 / 180, scaleY: H[i] / 56 },
            { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 0.4, ease: "power3.inOut", immediateRender: false }, t);
        })(c);
      }

      render();
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
