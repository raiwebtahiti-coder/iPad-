/* caméra 2D : le point monde (c.x, c.y) au centre de l'écran, échelle c.s ; flou en px écran (c.b) */
function kCam(world, c) {
  world.style.transformOrigin = "0 0";
  world.style.transform = "translate(" + (960 - c.x * c.s).toFixed(2) + "px," + (540 - c.y * c.s).toFixed(2) + "px) scale(" + c.s.toFixed(4) + ")";
  world.style.filter = c.b > 0.3 ? "blur(" + c.b.toFixed(1) + "px)" : "none";
}
/* arrivée : un peu trop grand et flou, puis se pose (0,4 s expo.out) */
function kArrive(tl, el, t, from, dy) {
  tl.fromTo(el, { opacity: 0, scale: from || 1.12, y: dy || 0, filter: "blur(10px)" },
    { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", immediateRender: t <= 0 }, t);
}
/* sortie rapide */
function kLeave(tl, el, t, dy) {
  tl.fromTo(el, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: dy || -24, filter: "blur(8px)", duration: 0.25, ease: "power2.in", immediateRender: false }, t);
}
/* surligneur jaune qui passe derrière un mot (.k-mk-bg) */
function kMark(tl, bg, t) { tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, t); }
/* cadre de mise en évidence (.k-spot) : se resserre sur la cible */
function kSpot(tl, el, t, tOut) {
  tl.fromTo(el, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out", immediateRender: false }, t);
  if (tOut != null) tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, tOut);
}
/* pastille / coche qui « pop » */
function kPop(tl, el, t) { tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)", immediateRender: false }, t); }
/* trait SVG qui se dessine (le chemin porte pathLength="100" stroke-dasharray="100" stroke-dashoffset="100") */
function kDraw(tl, path, t, d) { tl.fromTo(path, { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: d || 0.5, ease: "power2.out", immediateRender: false }, t); }
/* frappe au clavier dans un élément (texte remplacé à chaque image ; caret optionnel) */
function kType(tl, el, text, t, d, caret) {
  var p = { n: 0 };
  tl.fromTo(p, { n: 0 }, { n: text.length, duration: d, ease: "none", immediateRender: false,
    onUpdate: function () { el.textContent = text.slice(0, Math.round(p.n)); if (caret) el.appendChild(caret); } }, t);
}
/* curseur : un seul geste courbe de (x0,y0) à (x1,y1) entre t et t+d, puis clic direct (pression + onde) */
function kCursor(tl, el, x0, y0, x1, y1, t, d, ring) {
  var p = { k: 0 };
  var cx = (x0 + x1) / 2 + (y1 - y0) * 0.2, cy = (y0 + y1) / 2 - (x1 - x0) * 0.2;
  function place() { var k = p.k, a = (1 - k) * (1 - k), b = 2 * (1 - k) * k, c = k * k; gsap.set(el, { x: a * x0 + b * cx + c * x1, y: a * y0 + b * cy + c * y1 }); }
  tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none", immediateRender: false }, t);
  tl.fromTo(p, { k: 0 }, { k: 1, duration: d, ease: "power3.inOut", immediateRender: false, onUpdate: place }, t);
  kClick(tl, el, t + d + 0.04, ring, x1, y1);
  place();
}
/* déplacement du curseur déjà visible (sans le faire réapparaître), puis clic */
function kCursorMove(tl, el, x0, y0, x1, y1, t, d, ring, noClick) {
  var p = { k: 0 };
  var cx = (x0 + x1) / 2 + (y1 - y0) * 0.15, cy = (y0 + y1) / 2 - (x1 - x0) * 0.15;
  tl.fromTo(p, { k: 0 }, { k: 1, duration: d, ease: "power3.inOut", immediateRender: false,
    onUpdate: function () { var k = p.k, a = (1 - k) * (1 - k), b = 2 * (1 - k) * k, c = k * k; gsap.set(el, { x: a * x0 + b * cx + c * x1, y: a * y0 + b * cy + c * y1 }); } }, t);
  if (!noClick) kClick(tl, el, t + d + 0.04, ring, x1, y1);
}
function kClick(tl, el, t, ring, x, y) {

  tl.fromTo(el, { scale: 0.84 }, { scale: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, t + 0.07);
  if (ring) {
    tl.set(ring, { left: x + "px", top: y + "px" }, t);
    tl.fromTo(ring, { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.5, duration: 0.5, ease: "power2.out", immediateRender: false }, t + 0.03);
  }
}
/* sous-titres : une pastille par phrase, [{sub, t0, t1}] en temps LOCAUX ; le mot entre ** ** passe en jaune */
function kSubs(tl, box, lines, tEnd) {
  lines.forEach(function (ln, i) {
    var d = document.createElement("div"); d.className = "k-sub";
    d.innerHTML = ln.sub.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

    tl.fromTo(d, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out", immediateRender: tin <= 0 }, tin);
